# ============================
# DONATION QUERIES
# ============================

# List all donations with pagination
query ListDonations($limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  donations(limit: $limit, offset: $offset, orderBy: [{ donationDate: DESC }]) {
    id
    donationDate
    donorName
    estimatedValue
    donorContact
    observations
    campaign {
      id
      campaignName
      campaignStartDate
      campaignEndDate
    }
    createdAt
    updatedAt
  }
}

# Get donation by id
query GetDonationById($id: UUID!) @auth(level: USER) {
  donation(id: $id) {
    id
    donationDate
    donorName
    estimatedValue
    donorContact
    observations
    campaign {
      id
      campaignName
      campaignStartDate
      campaignEndDate
    }
    createdAt
    updatedAt
  }
}

# Search donations by donor name
query SearchDonations($donorName: String, $limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  donations(
    where: { donorName: { contains: $donorName } }
    limit: $limit
    offset: $offset
    orderBy: [{ donationDate: DESC }]
  ) {
    id
    donationDate
    donorName
    estimatedValue
    donorContact
    observations
    createdAt
    updatedAt
  }
}

# List donations by campaign
query ListDonationsByCampaign($campaignId: UUID!, $limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  donations(
    where: { campaign: { id: { eq: $campaignId } } }
    limit: $limit
    offset: $offset
    orderBy: [{ donationDate: DESC }]
  ) {
    id
    donationDate
    donorName
    estimatedValue
    donorContact
    observations
    createdAt
    updatedAt
  }
}

