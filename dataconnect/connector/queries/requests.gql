# List requests by beneficiary and status
query ListRequestsByBeneficiaryAndStatus(
  $beneficiaryId: UUID!,
  $statusCode: String!,
  $limit: Int = 10,
  $offset: Int = 0
) @auth(level: USER) {
  requests(
    where: {
      beneficiary: { id: { eq: $beneficiaryId } },
      status: { code: { eq: $statusCode } }
    }
    limit: $limit
    offset: $offset
    orderBy: [{ requestDate: DESC }]
  ) {
    id
    beneficiary {
      id
      fullName
      studentNumer
    }
    requestDate
    description
    status {
      id
      code
      description
      color
    }
    createdAt
    updatedAt
  }
}

# Search requests by beneficiary name or description
query SearchRequests($searchTerm: String, $limit: Int = 10, $offset: Int = 0) @auth(level: USER) {
  requests(
    where: {
      _or: [
        { beneficiary: { fullName: { contains: $searchTerm } } },
        { description: { contains: $searchTerm } }
      ]
    }
    limit: $limit
    offset: $offset
    orderBy: [{ requestDate: DESC }]
  ) {
    id
    beneficiary {
      id
      fullName
      studentNumer
      nif
      contactNumber
    }
    requestDate
    description
    status {
      id
      code
      description
      color
    }
    createdAt
    updatedAt
  }
}

# Count requests by status
query CountRequestsByStatus($statusCode: String!) @auth(level: USER) {
  requests(where: { status: { code: { eq: $statusCode } } }) {
    id
  }
}

