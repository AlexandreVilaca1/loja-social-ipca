# ============================
# LOG QUERIES
# ============================

# List all logs with pagination
query ListLogs($limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  logs(limit: $limit, offset: $offset, orderBy: [{ createdAt: DESC }]) {
    id
    description
    logType {
      id
      name
      code
    }
    user {
      id
      name
      email
    }
    createdAt
  }
}

# Get log by id
query GetLogById($id: UUID!) @auth(level: USER) {
  log(id: $id) {
    id
    description
    logType {
      id
      name
      code
    }
    user {
      id
      name
      email
    }
    createdAt
  }
}

# List logs by user
query ListLogsByUser($userId: UUID!, $limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  logs(
    where: { user: { id: { eq: $userId } } }
    limit: $limit
    offset: $offset
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    description
    logType {
      id
      name
      code
    }
    user {
      id
      name
      email
    }
    createdAt
  }
}

