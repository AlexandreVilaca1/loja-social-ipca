# ============================
# CANDIDACY QUERIES
# ============================

# List all candidacies with pagination
query ListCandidacies($limit: Int = 10, $offset: Int = 0) @auth(level: USER) {
  candidacies(limit: $limit, offset: $offset, orderBy: [{ applicationDate: DESC }]) {
    id
    beneficiary {
      id
      fullName
      studentNumer
      nif
      course
      contactNumber
    }
    applicationDate
    status {
      id
      code
      description
      color
    }
    observations
    createdAt
    updatedAt
  }
}

# Get candidacy by id
query GetCandidacyById($id: UUID!) @auth(level: USER) {
  candidacy(id: $id) {
    id
    beneficiary {
      id
      fullName
      studentNumer
      nif
      course
      isActive
      contactNumber
      address
      observations
    }
    applicationDate
    status {
      id
      code
      description
      color
      sortOrder
    }
    observations
    createdAt
    updatedAt
  }
}

# List candidacies by beneficiary
query ListCandidaciesByBeneficiary($beneficiaryId: UUID!, $limit: Int = 10, $offset: Int = 0) @auth(level: USER) {
  candidacies(
    where: { beneficiary: { id: { eq: $beneficiaryId } } }
    limit: $limit
    offset: $offset
    orderBy: [{ applicationDate: DESC }]
  ) {
    id
    beneficiary {
      id
      fullName
      studentNumer
    }
    applicationDate
    status {
      id
      code
      description
      color
    }
    observations
    createdAt
    updatedAt
  }
}

# List candidacies by status
query ListCandidaciesByStatus($statusCode: String!, $limit: Int = 10, $offset: Int = 0) @auth(level: USER) {
  candidacies(
    where: { status: { code: { eq: $statusCode } } }
    limit: $limit
    offset: $offset
    orderBy: [{ applicationDate: DESC }]
  ) {
    id
    beneficiary {
      id
      fullName
      studentNumer
      nif
      course
      contactNumber
    }
    applicationDate
    status {
      id
      code
      description
      color
    }
    observations
    createdAt
    updatedAt
  }
}

# Search candidacies by beneficiary name
query SearchCandidacies($searchTerm: String, $limit: Int = 10, $offset: Int = 0) @auth(level: USER) {
  candidacies(
    where: {
      beneficiary: {
        fullName: { contains: $searchTerm }
      }
    }
    limit: $limit
    offset: $offset
    orderBy: [{ applicationDate: DESC }]
  ) {
    id
    beneficiary {
      id
      fullName
      studentNumer
      nif
      contactNumber
    }
    applicationDate
    status {
      id
      code
      description
      color
    }
    observations
    createdAt
    updatedAt
  }
}

# Count candidacies by status
query CountCandidaciesByStatus($statusCode: String!) @auth(level: USER) {
  candidacies(where: { status: { code: { eq: $statusCode } } }) {
    id
  }
}

