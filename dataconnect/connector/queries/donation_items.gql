# ============================
# DONATION ITEM QUERIES
# ============================

# List donation items by donation
query ListDonationItemsByDonation($donationId: UUID!, $limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  donationItems(
    where: { donation: { id: { eq: $donationId } } }
    limit: $limit
    offset: $offset
  ) {
    donation {
      id
      donorName
    }
    product {
      id
      name
      unitOfMeasure
      category {
        id
        name
      }
    }
    expirationDate
    quantity
    observations
    createdAt
  }
}

# List donation items by product
query ListDonationItemsByProduct($productId: UUID!, $limit: Int = 8, $offset: Int = 0) @auth(level: USER) {
  donationItems(
    where: { product: { id: { eq: $productId } } }
    limit: $limit
    offset: $offset
  ) {
    donation {
      id
      donorName
      donationDate
    }
    product {
      id
      name
      unitOfMeasure
    }
    expirationDate
    quantity
    observations
    createdAt
  }
}

