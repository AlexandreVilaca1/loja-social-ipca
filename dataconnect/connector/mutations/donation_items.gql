# ============================
# DONATION ITEM MUTATIONS
# ============================

# Create a new donation item
mutation CreateDonationItem(
  $donationId: Donation_Key!,
  $productId: Product_Key!,
  $quantity: Int!,
  $stateId: StatusType_Key,
  $observations: String
) @auth(level: USER) {
  donationItem_insert(
    data: {
      donation: $donationId,
      product: $productId,
      quantity: $quantity,
      state: $stateId,
      observations: $observations
    }
  )
}

# Update donation item
mutation UpdateDonationItem(
  $donationId: UUID!,
  $productId: UUID!,
  $quantity: Int,
  $stateId: StatusType_Key,
  $observations: String
) @auth(level: USER) {
  donationItem_update(
    key: {
      donationId: $donationId,
      productId: $productId
    },
    data: {
      quantity: $quantity,
      state: $stateId,
      observations: $observations
    }
  )
}

# Delete donation item
mutation DeleteDonationItem($donationId: UUID!, $productId: UUID!) @auth(level: USER) {
  donationItem_delete(key: {
    donationId: $donationId,
    productId: $productId
  })
}

