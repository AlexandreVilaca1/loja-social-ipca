# ============================
# DONATION ITEM MUTATIONS
# ============================

# Create a new donation item
mutation CreateDonationItem(
  $donationId: Donation_Key!,
  $productId: Product_Key!,
  $expirationDate: Date,
  $quantity: Int!,
  $observations: String
) @auth(level: USER) {
  donationItem_insert(
    data: {
      donation: $donationId,
      product: $productId,
      expirationDate: $expirationDate,
      quantity: $quantity,
      observations: $observations
    }
  )
}

# Update donation item
mutation UpdateDonationItem(
  $donationId: UUID!,
  $productId: UUID!,
  $expirationDate: Date,
  $quantity: Int,
  $observations: String
) @auth(level: USER) {
  donationItem_update(
    key: {
      donationId: $donationId,
      productId: $productId
    },
    data: {
      expirationDate: $expirationDate,
      quantity: $quantity,
      observations: $observations
    }
  )
}

# Delete donation item
mutation DeleteDonationItem($donationId: UUID!, $productId: UUID!) @auth(level: USER) {
  donationItem_delete(key: {
    donationId: $donationId,
    productId: $productId
  })
}

