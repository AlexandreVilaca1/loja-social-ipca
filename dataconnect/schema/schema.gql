type User @table {
  name: String!
  uid: String
  email: String!
  passwordHash: String!
  role: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Category @table {
  name: String!
  description: String
  active: Boolean
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Product @table {
  name: String!
  unitOfMeasure: String!
  isActive: Boolean!
  description: String
  category: Category
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Lot @table {
  currentQuantity: Int!
  entryDate: Date!
  lotCode: String!
  expirationDate: Date
  observations: String
  product: Product
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type StatusType @table {
  code: String!
  description: String!
  sortOrder: Int!
  color: String
  active: Boolean
  createdAt: Timestamp! @default(expr: "request.time")
}

type Donation @table {
  donationDate: Date!
  donorName: String!
  estimatedValue: Float!
  donorContact: String
  observations: String
  campaign: Campaign
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Distribution @table {
  distributionDate: Date!
  observations: String
  responsibleStaff:
  beneficiary: Beneficiary
  status: StatusType
  createdAt: Timestamp! @default(expr: "request.time")
}

type Beneficiary @table {
  fullName: String!
  studentNumer: Int!
  nif: String!
  course: String!
  isActive: Boolean!
  contactNumber: String!
  uid: String
  address: String
  observations: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Campaign @table {
  campaignName: String!
  campaignStartDate: Date!
  campaignEndDate: Date!
  address: String!
  type: String!
  observations: String
  user: User
  status: StatusType
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type DonationItem @table(key: ["donation", "product"]) {
  donation: Donation!
  product: Product!
  expirationDate: Date
  quantity: Int!
  observations: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type DistributionItem @table(key: ["distribution", "lot"]) {
  distribution: Distribution!
  lot: Lot!
  quantity: Int!
  observations: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type LogType @table {
  name: String!
  code: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Log @table {
  description: String!
  logType: LogType!
  user: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Candidacy @table {
  applicationDate: Date!
  status: StatusType
  observations: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Request @table {
  beneficiary: Beneficiary!
  requestDate: Date!
  description: String
  status: StatusType
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}